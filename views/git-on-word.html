<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        #bodyId {
            padding: 10px;
            padding-top: 5px
        }

        /*****SELECTING FOLDER****/
        #folderOverview {
            margin-bottom: 0px
        }

        #projectDirectory {
            font-weight: bold;
            margin-right: 15px;
            font-size: 14pt
        }

        #projectDirectory {
            cursor: pointer
        }

        #changeFolder {
            display: inline-block;
            font-size: 11pt;
            border: 1px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #closeChoose {
            display: none;
            font-size: 11pt;
            border: 1px solid red;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #newFolderButton, #newDocButton {
            cursor: pointer;
            padding-left: 4px;
            padding-right: 4px;
            border-radius: 3px;
        }

         #newFolderButton:hover, #newDocButton:hover {
            background-color: #d4eff7;
        }

        /****Folder Contents****/


        .subFolder {
            cursor: pointer;
            margin-bottom: 5px;
            margin-top: 5px;
            border-radius: 5px;
            padding-left: 5px;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        .subFolder:hover {
            background-color: #EFF9FC
        }

        .parentDiv {
            border: 2px solid red
        }

        /***COMMIT MESSAGE****/
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #778899;
        }

        #noteForSave {
            border: 1px solid black;
            border-radius: 7px;
            padding: 10px;
            outline: none;
            font-size: 13pt;
            margin-top: 15px;
        }

        #selectedDoc {
            font-size: 14pt
        }

        #addProjectButton {
            display: none;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 12px;
            padding: 7px;
            border: 2px solid #3399FF;
            outline: none;
            margin-top: 15px;
        }

        #addProjectButton:hover {
            background-color: #3399FF;
            color: white;
            border: 3px solid #3399FF;
        }

        .saveProjectItems {
            /*display: none*/
        }

        #saveButton {
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #32cd53;
            outline: none;
            margin-top: 15px;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        /***MAKING THE COMMIT****/

        #saveButton:hover {
            background-color: #32cd53;
            color: white
        }
    </style>
    <title>Your Project</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId">
    <!------Select Project Folder------>
    <div id="folderOverview">
        <div style="text-align: right; margin-bottom: 10px">
            <div id="changeFolder">change project folder</div>
        </div>
        <div>    
            <span id="projectDirectory" class="docOrDirectory"></span>
            <div></div><!--new folder/doc box goes heret-->
           <!---- <span style="margin-right: 15px" id="newFolderButton">nf+</span><span id="newDocButton">nd+</span>-->
        </div>
    </div>

    <!------List out contents of the folder------>
    <div id="folderContents"></div>


    <!-------Display Doc to Update-------->
 
    <div style="margin-top: 25px">
        <hr style="width: 70%; border: 1px solid  #f5f5f5">
        <span style="margin-right: 10px">Save project version:</span><span id="selectedDoc"></span>
    </div>
    <div id="addProjectButton">Add File</div>

    <!-----Git: Save Version----->
    <div class="saveProjectItems">
        <div id="noteForSave" contenteditable="true" data-placeholder="Enter note to go along with save"></div>
        </br>

        <div id="saveButton">Save Project Version</div>
    </div>


    <script src="../javascripts/git-on-word.js"></script>
</body>

</html>
