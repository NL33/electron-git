<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>

          .d2h-code-line, .d2h-code-line-ctn {
      white-space: normal !important;
    } 
        #bodyId {
            padding: 10px;
            padding-top: 5px
        }

        /*****SELECTING FOLDER****/
        #folderOverview {
            margin-bottom: 0px
        }

        #projectDirectory {
            font-weight: bold;
            margin-right: 15px;
            font-size: 14pt
        }

        #projectDirectory {
            cursor: pointer
        }

        #changeFolder {
            display: inline-block;
            font-size: 11pt;
            border: 1px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #closeChoose {
            display: none;
            font-size: 11pt;
            border: 1px solid red;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #newFolderButton,
        #newDocButton {
            cursor: pointer;
            padding-left: 4px;
            padding-right: 4px;
            border-radius: 3px;
        }

        #newFolderButton:hover,
        #newDocButton:hover {
            background-color: #d4eff7;
        }

        /****Folder Contents****/


        .subFolder {
            cursor: pointer;
            margin-bottom: 5px;
            margin-top: 5px;
            border-radius: 5px;
            padding-left: 5px;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .subFolder:hover {
            background-color: #EFF9FC
        }

        .parentDiv {
            border: 2px solid red
        }

        /***COMMIT MESSAGE****/
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #778899;
        }

        #noteForSave {
            border: 1px solid black;
            border-radius: 7px;
            padding: 10px;
            outline: none;
            font-size: 13pt;
            margin-top: 15px;
        }

        #selectedDoc {
            font-size: 14pt
        }

        #addProjectButton {
            display: none;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 12px;
            padding: 7px;
            border: 2px solid #3399FF;
            outline: none;
            margin-top: 15px;
        }

        #addProjectButton:hover {
            background-color: #3399FF;
            color: white;
            border: 3px solid #3399FF;
        }

        #savingProgress {
            display: none;
            margin-top: 25px;
            font-style: italic;
            font-size: 14pt
        }

        #saveButton {
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #32cd53;
            outline: none;
            margin-top: 15px;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        /***MAKING THE COMMIT****/

        #saveButton:hover {
            background-color: #32cd53;
            color: white
        }


        /*****PRIOR VERSIONS*****/

        #viewPriorVersionsButton {
            display: inline-block;
            font-size: 12pt;
            border: 3px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
        }

        #viewPriorVersionsButton:hover {
            background-color: #d4eff7;
        }


        .versionOverviewClass {
            padding: 5px;
            margin-bottom: 12px;
            border: 2px solid #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            color: #1a1a1a
        }

        .versionOverviewClass:hover {
            background-color: #d4eff7
        }

        .versionMessage {
            margin-bottom: 5px;
            font-size: 14pt
        }

        .versionNumber {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #2db94b;
        }

        .versionDateTime {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #2db94b;
        }

        #savedVersionsId {
            margin-top: 15px;
            margin-bottom: 10px;
            margin-left: 3px;
            font-size: 14pt;
        }
    </style>
    <title>Your Project</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId">
    <!------Select Project Folder------>
    <div id="folderOverview">
        <div style="text-align: right; margin-bottom: 10px">
            <div id="changeFolder">change project folder</div>
        </div>
        <div>
            <span id="projectDirectory" class="docOrDirectory"></span>
            <div></div>
            <!--new folder/doc box goes heret-->
            <!---- <span style="margin-right: 15px" id="newFolderButton">nf+</span><span id="newDocButton">nd+</span>-->
        </div>
    </div>

    <!------List out contents of the folder------>
    <div id="folderContents"></div>


    <!-------separator-------->
<hr style="width: 70%; border: 1px solid  #f5f5f5">
    <div id="gitDiffTest" style="border: 2px solid green; cursor: pointer; padding: 3px">Run Git Diff</div>
   <div id="displayGitDiff" style="white-space: pre-wrap"></div>

    <div style="margin-top: 15px">
        <hr style="width: 70%; border: 1px solid  #f5f5f5">
        <span style="margin-right: 10px">Save project version:</span>
        <!--<span id="selectedDoc"></span>-->
    </div>

    <!--<div id="addProjectButton">Add File</div> from focus on individual files. not in use -->

    <!-----Git: Save Version----->
    <div id="saveProjectItems">
        <div id="noteForSave" contenteditable="true" data-placeholder="Enter note to go along with save"></div>
        </br>

        <div id="saveButton">Save Project Version</div>
    </div>
    <div id="savingProgress">Saving version...
    </div>

    <!-------View Prior Versions-------->

    <div style="margin-top: 25px">
        <hr style="width: 70%; margin-bottom: 25px; border: 1px solid  #f5f5f5">
        <span style="margin-right: 10px" id="viewPriorVersionsButton">view saved versions</span>
        <!--<span id="selectedDoc"></span>-->
    </div>

    <div id="savedVersionsOverview" style="margin-top: 25px; display: none">
        <div id="savedVersionsId">Saved Versions:</div>
    </div>
    <div id="showPriorCommits" style="margin-top: 10px">
    </div>


    <script src="../javascripts/git-on-word.js"></script>
</body>

</html>
