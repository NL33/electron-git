<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>

        /*****SELECTING FOLDER****/
          #folderOverview {
            margin-bottom: 10px
        }

        #directory {
            font-weight: bold
        }

        #changeFolder {
            display: inline-block;
            font-size: 11pt;
            border: 1px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #closeChoose {
            display: none;
            font-size: 11pt;
            border: 1px solid red;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }



        /***COMMIT MESSAGE****/
         [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #778899;
        }

        #saveNote {
            border: 1px solid black;
            border-radius: 7px;
            padding: 7px;
            outline: none;
            cursor: pointer;
            margin-top: 15px;
        }


        #saveButton {
            /*display: none;*/
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #32cd53;
            outline: none;
            margin-top: 15px;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        /***MAKING THE COMMIT****/

        #saveButton:hover {
            background-color: #32cd53;
            color: white
        }

    </style>
    <title>Save Version</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId">
    <div id="folderOverview">
        <span style="margin-bottom: 10px">
            <span">Current folder:
        </span>
        <span id="directory"></span>
        <span id="changeFolder">change folder</span>
        <span id="closeChoose">close "Choose Files"</span>
        </span></br>
    </div>
    <div id="saveNote" contenteditable="true" data-placeholder="Enter note to go along with save"></div>
    </br>
    <div id="saveButton">Save Version</div>


    <script src="../javascripts/git-on-word.js"></script>
</body>

</html>
