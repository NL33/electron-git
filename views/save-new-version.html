<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="../script.js"></script>
    <style>
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #778899;
        }

        #saveNote {
            border: 1px solid black;
            border-radius: 10px;
            padding: 7px;
            outline: none;
            cursor: pointer;
        }

        #saveButton {
            /*display: none;*/
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #32cd53;
            outline: none;
            margin-top: 15px;
           /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        #saveButton:hover {
            background-color: #32cd53;
            color: white
        }
    </style>
    <title>Save New Version</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>
<div id="header">Save New Version</div></br>
<div id="saveNote" contenteditable="true" data-placeholder="Enter note to go along with save"></div>
<div id="saveButton">Save</div>

</html>
