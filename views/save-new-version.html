<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #778899;
        }

        #folderOverview {
            margin-bottom: 10px
        }

        #directory {
            font-weight: bold
        }

        #file-input {
            margin-top: 10px;
            display: none;
        }

        #changeFolder {
            display: inline-block;
            font-size: 11pt;
            border: 1px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #closeChoose {
            display: none;
            font-size: 11pt;
            border: 1px solid red;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #saveNote {
            border: 1px solid black;
            border-radius: 10px;
            padding: 7px;
            outline: none;
            cursor: pointer;
        }

        #saveButton {
            /*display: none;*/
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #32cd53;
            outline: none;
            margin-top: 15px;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        #saveButton:hover {
            background-color: #32cd53;
            color: white
        }


        #saveFileButton {
            /*display: none;*/
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #3399FF;
            outline: none;
            margin-top: 15px;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        #saveFileButton:hover {
            background-color: #3399FF;
            color: white
        }

        #ifNoNewVersion {
            display: none;
            margin-top: 15px
        }

        #ifNewVersionSaved {
            display: none;
            margin-top: 15px
        }
    </style>
    <title>Save New Version</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId">
    <div id="folderOverview">
        <span style="margin-bottom: 10px">
            <span">Current folder:
        </span>
        <span id="directory"></span>
        <span id="changeFolder">change folder</span>
        <span id="closeChoose">close "Choose File"</span>
        </span></br>
        <input type="file" id="file-input" />
    </div>


    </br>
    <div id="saveNote" contenteditable="true" data-placeholder="Enter note to go along with save"></div>
    <div id="saveButton">Save</div></br>
    <div id="ifNoNewVersion">
        <div>There are no changes, so a new version has not been saved.</div>
    </div>
    <div id="ifNewVersionSaved">
        <div id="commitResult">New Version Saved</div>
        <div id="showResults"></div>
    </div>

    </br>
    <div id="saveFileButton">Save File</div>



    <!--<script src="../script.js"></script>-->
    <script src="../save-local-file.js"></script>

</body>

</html>
