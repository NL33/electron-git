<!DOCTYPE html>
<html>

<!--<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />  <!--CSS. if want to go with this method, can try downloading the file directly into the app so you can access the diff even when offline. This one is 60kb-->

<!--<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script><!--Javascripts. if want to go with this method, can try downloading the file directly into the app so you can access the diff even when offline. This one is 80kb-->

<head>
    <meta charset="UTF-8">
    <style>
         /****BODY ***/
        #bodyId {
            padding: 10px;
            padding-top: 5px
        }

        /*** COMPARING VERSIONS: diff2html stying***/

        .d2h-code-line,
        .d2h-code-line-ctn {
            white-space: normal !important;
        }

        .d2h-ins {
            background-color: #d6ebd5
        }

        .d2h-icon { /*this is an icon printed next to any changed file*/
            display: none
        }

        .d2h-changed { /*text that says:"CHANGED"*/
            display: none
        } 

        .d2h-file-collapse {/*text that says: "Viewed" with a checkmark*/
            display: none
        }

        .d2h-file-stats { /*in header, shows change numbers*/
            display: none;
        }

        .d2h-code-linenumber {/*display of line numbers next to change results*/
            display: none; 
        }

        .d2h-info { /*summary of changes--BUT THESE MIGHT BE SHOWING LINE */
            display: none
        }

        .d2h-file-list-header {  /*header at top of diff2html output, saying things like "files changed (2) hide show"*/
            display: none;
        }

        .d2h-file-header {
            border-top: 5px solid #32cd53;
            padding-top: 15px;
            font-weight: bold; 
            font-size: 14pt;
            margin-bottom: 10px; 
           /*
            margin-top: 0px; 
            margin-bottom: 2px;
            white-space: pre-wrap
            */
        }

        .d2h-moved { /* this is a tag that says "RENAMED" if a file has been renamed */
            display: none;
        }

        .d2h-del {
            background-color: #fbe9ec;
            // background-color: #fdf0c5  //more of a tannish background color
        }

        tr ins {
            background-color: #9df2af
        }

        tr del {
            background-color: #f1a7b3
        }

        /*CLICK BUTTON TO EXPAND ON DOC**/
        .showThisDocClass {
           display: inline-block;
            font-size: 11pt;
            border: 1px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px  
        }

    </style>
    <title>Showing Changes</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId">
<div id="diffFileNameSummary" style="margin-bottom: 10px"></div>
<div id="showDiffIntegrated"></div>
<div id="showDiffBlock"></div>

    <!--*************END OF FILE******************-->
    <script src="../javascripts/compare-versions.js"></script>
</body>

</html>
