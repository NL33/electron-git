<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        #bodyId {
            padding: 10px;
            padding-top: 5px
        }

        /*****SELECTING FOLDER****/
        #folderOverview {
            margin-bottom: 10px
        }

        #projectDirectory {
            font-weight: bold;
            margin-right: 15px;
            font-size: 14pt;
            margin-bottom: 15px
        }

        #projectDirectory {
            cursor: pointer
        }

        #changeFolder {
            display: inline-block;
            font-size: 11pt;
            border: 1px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #closeChoose {
            display: none;
            font-size: 11pt;
            border: 1px solid red;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #newFolderButton,
        #newDocButton {
            cursor: pointer;
            padding-left: 4px;
            padding-right: 4px;
            border-radius: 3px;
        }

        #newFolderButton:hover,
        #newDocButton:hover {
            background-color: #d4eff7;
        }

        /****Folder Contents****/


        .subFolder {
            cursor: pointer;
            margin-bottom: 5px;
            margin-top: 5px;
            border-radius: 5px;
            padding-left: 5px;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .subFolder:hover {
            background-color: #EFF9FC
        }

        .parentDiv {
            border: 2px solid red
        }

        /***COMMIT MESSAGE****/
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #778899;
        }

        #noteForSave {
            border: 1px solid black;
            border-radius: 7px;
            padding: 10px;
            outline: none;
            font-size: 13pt;
            margin-top: 15px;
        }

        #selectedDoc {
            font-size: 14pt
        }

        #addProjectButton {
            display: none;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 12px;
            padding: 7px;
            border: 2px solid #3399FF;
            outline: none;
            margin-top: 15px;
        }

        #addProjectButton:hover {
            background-color: #3399FF;
            color: white;
            border: 3px solid #3399FF;
        }

        #savingProgress {
            display: none;
            margin-top: 25px;
            font-style: italic;
            font-size: 14pt
        }

        #saveButton {
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #32cd53;
            outline: none;
            margin-top: 15px;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        /***MAKING THE COMMIT****/

        #saveButton:hover {
            background-color: #32cd53;
            color: white
        }


        /*****PRIOR VERSIONS*****/

        #viewPriorVersionsButton {
            display: inline-block;
            font-size: 12pt;
            border: 3px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
        }

        #viewPriorVersionsButton:hover {
            background-color: #d4eff7;
        }


        .versionOverviewClass {
            padding: 5px;
            margin-bottom: 12px;
            border: 2px solid #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            color: #1a1a1a
        }

        .versionOverviewClass:hover {
            background-color: #d4eff7
        }

        .versionMessage {
            margin-bottom: 15px;
            font-size: 14pt
        }

        .versionNumber {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #2db94b;
        }

        .versionDateTime {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #2db94b;
        }

        #savedVersionsId {
            margin-top: 15px;
            margin-bottom: 10px;
            margin-left: 3px;
            font-size: 14pt;
        }
    </style>
    <title>Older Version</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId" style="border: 3px solid red; margin: 0px; display: block; background-color: white; min-height: 550px; padding-top: 5px">
    <div id="folderOverview">
        <div>
            <span id="projectDirectory" class="docOrDirectory"></span>
            <div></div>
            <!--new folder/doc box goes heret-->
            <!---- <span style="margin-right: 15px" id="newFolderButton">nf+</span><span id="newDocButton">nd+</span>-->
        </div>
    </div>
    <div></div>
    <div>
        <div class="versionMessage" id="versionMessageId"></div>
        <span class="versionNumber">
            <span>Version </span>
            <span id="versionNumberId"></span>
        </span>
        <span class="versionDateTime" id="versionDateId"></span><span id="versionTimeId"></span>
<hr style="width: 80%; margin-bottom: 15px; border: 2px solid  #f5f5f5">

    <!------List out contents of the folder------>
    <div id="folderContents"></div>




    <script src="../javascripts/get-old-version.js"></script>

</body>

</html>
