<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        /*****SELECTING FOLDER****/
        #folderOverview {
            margin-bottom: 5px
        }

        #projectDirectory {
            font-weight: bold;
            margin-right: 15px;
            font-size: 14pt;
        }

        #projectDirectory {
            cursor: pointer
        }

        #changeFolder {
            display: inline-block;
            font-size: 11pt;
            border: 1px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #closeChoose {
            display: none;
            font-size: 11pt;
            border: 1px solid red;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            margin-left: 15px
        }

        #newFolderButton,
        #newDocButton {
            cursor: pointer;
            padding-left: 4px;
            padding-right: 4px;
            border-radius: 3px;
        }

        #newFolderButton:hover,
        #newDocButton:hover {
            background-color: #d4eff7;
            box-shadow: 0 3px 5px 0 rgba(0, 0, 0, 0.2), 0 2px 3px 0 rgba(0, 0, 0, 0.19) !important;
        }

        /****Folder Contents****/


        .subFolder {
            cursor: pointer;
            margin-bottom: 5px;
            margin-top: 5px;
            border-radius: 5px;
            padding-left: 5px;
            padding-top: 6px;
            padding-bottom: 6px;

        }

        .subFolder:hover {
            background-color: #d4eff7;
            box-shadow: 0 3px 5px 0 rgba(0, 0, 0, 0.2), 0 2px 3px 0 rgba(0, 0, 0, 0.19) !important;
        }

        .highlightFolderOrFile {
            background-color: #EFF9FC;
            box-shadow: 0 3px 5px 0 rgba(0, 0, 0, 0.2), 0 2px 3px 0 rgba(0, 0, 0, 0.19) !important;
        }


        /***MAKING THE COMMIT****/

        #saveButton:hover {
            background-color: #32cd53;
            color: white
        }


        /*****PRIOR VERSIONS*****/

        #viewPriorVersionsButton {
            display: inline-block;
            font-size: 12pt;
            border: 3px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
        }

        #viewPriorVersionsButton:hover {
            background-color: #d4eff7;
        }


        .versionOverviewClass {
            padding: 5px;
            margin-bottom: 12px;
            border: 2px solid #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            color: #1a1a1a
        }

        .versionOverviewClass:hover {
            background-color: #d4eff7
        }

        .versionMessage {
            margin-bottom: 10px;
            font-size: 14pt
        }

        .versionNumber {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #2db94b;
        }

        .versionDateTime {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #2db94b;
        }

        #savedVersionsId {
            margin-top: 15px;
            margin-bottom: 10px;
            margin-left: 3px;
            font-size: 14pt;
        }

        #highlightFolderOverview {
            box-shadow: 0 3px 5px 0 rgba(0, 0, 0, 0.2), 0 2px 3px 0 rgba(0, 0, 0, 0.19) !important;
        }

        .highlightFolderOrFile {
            background-color: #EFF9FC;
            box-shadow: 0 3px 5px 0 rgba(0, 0, 0, 0.2), 0 2px 3px 0 rgba(0, 0, 0, 0.19) !important;
        }

        .folderIcon {
            padding-right: 3px;
            height: 11pt;
            width: 9pt;
            vertical-align: text-top;
        }


        .parentDiv {
            border: 2px solid red;
            box-sizing: border-box;
        }

        #bodyId {
            padding: 15px;
            padding-top: 30px;
            border: 3px solid red;
            border-radius: 10px;
            /* margin: 0px; */
            margin: 10px;
            display: block;
            background-color: white;
            min-height: 530px;
            padding-top: 5px;
            box-shadow: 0 7px 6px 0 rgb(0 0 0 / 20%), 0 8px 10px 5px rgb(0 0 0 / 19%) !important
        }
    </style>
    <title>Saved Version</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId" style="">
    <div id="folderOverview">
        <div>
            <img src="../clear-folder-fntawesome.svg"
                style="padding-right: 1px; height: 13pt; width: 12pt; vertical-align: text-top"></img>
            <span id="projectDirectory" class="docOrDirectory"></span>
            <div></div>

        </div>

    </div>
    <div></div>
    <div>
        <div class="versionMessage" id="versionMessageId"></div>
        <span class="versionNumber">
            <span>Version </span>
            <span id="versionNumberId"></span>
        </span>
        <span class="versionDateTime" id="versionDateId"></span><span id="versionTimeId"></span>
    </div>
    </div>
    <hr style="width: 80%; margin-bottom: 15px; border: 2px solid  #f5f5f5">

    <!------List out contents of the folder------>
    <div id="folderContents"></div>

    <script src="../javascripts/get-old-version.js"></script>

</body>

</html>
