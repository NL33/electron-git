<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        /*** COMPARING VERSIONS***/
        .showChangesButton {
            margin-right: 10px;
            padding: 3px;
            border: 2px solid #32cd53;
            border-radius: 12px;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2), 0 5px 4px 0 rgba(0, 0, 0, 0.19) !important;
        }

        .folderIcon {
            padding-right: 3px;
            height: 11pt;
            width: 9pt;
            vertical-align: text-top;
        }

        .showChangesButton:hover {
            background-color: #32cd53;
            border: 3px solid #32cd53;
            color: white;
            box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2), 0 5px 4px 0 rgba(0, 0, 0, 0.19) !important;
        }




        /*****PRIOR VERSIONS*****/

        #viewPriorVersionsButton {
            display: inline-block;
            font-size: 12pt;
            border: 3px solid #d4eff7;
            border-radius: 15px;
            padding: 2px;
            padding-left: 8px;
            padding-right: 8px;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 20%), 0 1px 1px 0 rgb(0 0 0 / 19%) !important;
        }

        #viewPriorVersionsButton:hover {
            background-color: #d4eff7;
            box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2), 0 5px 4px 0 rgba(0, 0, 0, 0.19) !important;
        }


        .versionOverviewClass {
            padding: 8px;
            margin-bottom: 15px;
            border: 2px solid #d4eff7;
            border-radius: 10px;
            cursor: pointer;
            color: #1a1a1a;
            // box-shadow: 0 1px 2px 0 rgb(0 0 0 / 20%), 0 1px 1px 0 rgb(0 0 0 / 19%) !important;     
        }

        .versionOverviewClass:hover {
            background-color: #d4eff7;
            border: 2px solid #d4eff7;
            box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2), 0 5px 4px 0 rgba(0, 0, 0, 0.19) !important;
        }

        .versionMessage {
            margin-bottom: 8px;
            font-size: 14pt
        }

        .versionNumber {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #6fdc87;
        }

        .versionDateTime {
            margin-right: 10px;
            padding-right: 10px;
            border-right: 2px solid #6fdc87;
        }

        .versionNumberOverview {
            font-size: 14pt
        }

        #selectVersionsHeader {
            margin-top: 15px;
            margin-bottom: 10px;
            margin-left: 3px;
            /*font-size: 14pt;*/
        }

        .selectedChangeClass {
            border: 3px solid #6fdc87;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 3px 2px 0 rgba(0, 0, 0, 0.19) !important;
        }

        .changeView {
            display: inline-block;
            cursor: pointer;
            text-align: center;
            margin-right: 50px;
            font-size: 13pt;
            /*font-size: 10pt;*/
            border-radius: 10px;
            padding: 5px;
            border: 2px solid #d4eff7;
            outline: none;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 3px 2px 0 rgba(0, 0, 0, 0.19) !important;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        .changeView:hover {
            background-color: #3399FF;
            border: 2px solid #3399FF;
            color: white;
            box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2), 0 5px 4px 0 rgba(0, 0, 0, 0.19) !important;
        }

        .blueFolderEffect {
                 //   height: 18px;
            //width: 18px;
            margin-right: 2px;
            vertical-align: text-top;
            filter: invert(51%) sepia(80%) saturate(619%) hue-rotate(182deg) brightness(102%) contrast(101%);
        }
    </style>
    <title>Prior Versions</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body id="bodyId" style="margin-top: 5px; padding: 10px; padding-top: 5px; overflow: auto; font-family: serif">
    <div style='font-size: 13pt; margin-bottom: 8px; font-style: italic;' id="processingMessage">processing...</div>

    <!--***************View Prior Versions**************-->
    <div id="showPriorVersions" style="display: none;">
        <div
            style="position: fixed; width: 100%; margin-right: 20px; z-index: 1000; background-color: white; top: 0; border-bottom: 3px solid #f2f2f2; padding-bottom: 20px;">
            <div style="display: inline-block">
                <div id="projectNameOverview" style="margin-bottom: 15px; padding-top: 15px">
                <img class="blueFolderEffect icon" src="../assets/folder_open_google_icon.svg"></img>
                    <span id="projectName" style="font-weight: bold; font-size: 16pt; vertical-align: top"></span>
                </div>
                <div id="savedVersionsId" style="font-size: 12pt">Click to open version files:</div>
            </div>
            <span style="float: right; display: none">
                <div onclick="compareVersionsFunction()" class="changeView" id="closeCompareChangesView"
                    style="margin-top: 15px; margin-right: 70px">Compare Versions</div>
            </span>
        </div>

        <div id="showPriorCommits" style="width: 93%; margin-top: 115px; margin-left: 15px"></div>
    </div>


    <!--**********COMPARE CHANGES***********************-->
    <div id="showViewPriorVersionsForCompare" style="display: none">
        <div
            style="margin-top: 0px; position: fixed; background-color: white; z-index: 1000; width: 95%; top: 0; padding-top: 15px; border-bottom: 3px solid #f2f2f2;">
            <div style="margin-top: 0px; display: inline-block;">

                <div id="projectNameOverview" style="margin-top: 0px; margin-bottom: 15px;">
                    <img src="../clear-folder-fntawesome.svg"
                        style="padding-right: 1px; height: 13pt; width: 12pt; vertical-align: text-top"></img>
                    <span id="projectNameCompare" style="font-weight: bold; font-size: 16pt"></span>
                </div>
                <div style="text-align: center; font-weight: 250; display: inline-block; margin-bottom: 10px">Compare
                    Versions:</div>


                <div>
                    <div style="margin-left: 10px; margin-right: 3px; word-wrap: break-word; float: left">
                        <div style="margin-bottom: 8px" id="displayNewerVersion">
                            <span>Newer Version: </span>
                            <span id="laterVersionOverview">
                                <span class="selectedForChangesClass" id="laterVersionForChanges"></span>
                                <span class="versionNumberOverview">
                                    <span class="versionWordLater"></span>
                                    <span id="versionNumberLater">Current Changes</span>
                                </span>
                                <div id="versionMessageLater" style="display:none">n/a</div>
                                <span id="versionDateLater" style="display:none">n/a</span><span id="versionTimeLater"
                                    style="display:none">n/a</span>
                                <span id="commitNumberLater" style="display: none">current-changes</span>
                            </span>
                            </span>
                        </div>

                        <div style="margin-bottom: 10px" id="displayOlderVersion">
                            <span>Older Version: </span>
                            <span id="earlierVersionOverview">
                            </span>
                        </div>
                    </div>

                    <div style=" margin-right: 5px; margin-left: 70px; margin-top: 5px" id="runChangesIntegrated"
                        class="showChangesButton">Show Changes
                    </div>
                </div>
                <!-- Removed as option for now just to keep things simple: <div class="showChangesButton" id="runChangesBlock">show block changes
                </div>-->
                <div id="savedVersionsOverview" style="margin-top: 30px; clear: both">
                    <div id="selectVersionsHeader">Select versions to compare:</div>
                </div>
            </div>
            <span style="display: inline-block; float: right">
                <div onclick="openPriorVersionsFunction()" class="changeView" id="closeCompareChangesView">Open Prior
                    Versions</div>
            </span>
        </div>
        <div id="showPriorCommitsForCompare" style="clear: both; margin-left: 15px; margin-top: 200px; width: 93%;">
        </div>
    </div>



    <!--*************END OF FILE******************-->
    <script src="../javascripts/prior-versions-overview.js"></script>
</body>

</html>
