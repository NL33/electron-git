<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title id="theTitle">Gratitude Notes</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <style>
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #778899;
        }

        * {
            font-family: "Roboto", sans-serif;
            font-size: 11.5pt;
        }

        .noteEntryOverview {
            padding-bottom: 15px;
            position: fixed;
            width: 100%;
            background-color: white;
            z-index: 1000;
        }

        #noteEntry {
            border: 3px solid #3399ff;
            border-radius: 10px;
            padding: 5px;
            outline: none;
            padding: 10px;
            min-height: 40px;
            margin-left: 10px;
            margin-right: 10px;
        }

        #saveButton {
            display: inline-block;
            cursor: pointer;
            text-align: center;
            /*font-size: 10pt;*/
            border-radius: 8px;
            padding: 5px;
            border: 2px solid #d4eff7;
            outline: none;
            margin-top: 10px;
            margin-right: 10px;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 3px 2px 0 rgba(0, 0, 0, 0.19) !important;
            /* margin-left: 35px;
            vertical-align: 20%;*/
        }

        #saveButton:hover {
            background-color: #3399FF;
            color: white;
            border: 2px solid #3399FF;
            box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2), 0 5px 4px 0 rgba(0, 0, 0, 0.19) !important;
        }

        #showCurrentNotes {
            overflow: auto;
            margin-left: 10px;
            margin-right: 10px;
            margin-top: 20px;
            box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.2), 0 5px 4px 0 rgba(0, 0, 0, 0.19) !important;
            border-radius: 10px;
            padding: 5px;
            padding-top: 10px;
        }

        .noteOverview {
            margin-bottom: 5px;
            margin-right: 10px;
            padding: 10px;
        }

        .showDate {
           /* font-weight: 300;*/
            color: #3399ff;
            margin-bottom: 10px;
            margin-right: 50px;
            text-align: center;
        }

        .noteText {
            margin-left: 5px
        }

        .overviewDiv {
            display: flex;
        }

        .column1 {
            flex: 20%;
        }

        .column2 {
            flex: 80%
        }
    </style>
</head>

<body>
    <div class="overviewDiv">
        <div class="column1" style="border-right: 3px solid #3399ff;">
                <div>Hello there</div>
        </div>
        <div class="column2">
        <div id="noteEntryOverview">
            <div contenteditable="true" tabindex="1" id="noteEntry" data-placeholder="Write a gratitude note here."></div>
            <div style="text-align: right">
                <div id="saveButton" onclick="saveNote()">save note</div>
            </div>
        </div>
        <div id="showCurrentNotes"></div> 
     </div>
  </div>



    <script src="../javascripts/gratitude-window.js"></script>
</body>

</html>
